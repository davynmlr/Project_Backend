# Used by the tests instead of src/main/resources/application.properties,
# so tests run on an empty in-memory H2 database and never touch MySQL on softala.
spring.application.name=projectbackend

# H2 DATABASE SETTINGS
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver

# REST API BASE PATH
spring.data.rest.base-path=/api

# MAIL (never actually sent in tests)
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=noreply@projectbackend.local
