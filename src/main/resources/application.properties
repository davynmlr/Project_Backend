spring.application.name=projectbackend


# H2 DATABASE SETTINGS
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb

#SHOW GENERATED SQL
spring.jpa.show-sql=true

# REST API BASE PATH
spring.data.rest.base-path=/api

# MAIL (Mailpit, local testing). Web inbox at http://localhost:8025
# For Gmail instead: comment these out and uncomment the block below (set GMAIL_USERNAME and GMAIL_APP_PASSWORD).
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@projectbackend.local
