spring.application.name=projectbackend

# H2 DATABASE SETTINGS
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#spring.datasource.url=jdbc:h2:mem:testdb

#SHOW GENERATED SQL
spring.jpa.show-sql=true

# REST API BASE PATH
spring.data.rest.base-path=/api

# MySQL DATABASE SETTINGS (softala; from your PC open the tunnel first:
# ssh -L 3306:localhost:3306 davynm@softala.haaga-helia.fi)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/davynm?serverTimezone=UTC
spring.datasource.username=davynm
spring.datasource.password=password
# update = create missing tables, keep existing data between restarts
spring.jpa.hibernate.ddl-auto=update
server.port=7076

# MAIL (Mailpit, local testing). Web inbox at http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@projectbackend.local

