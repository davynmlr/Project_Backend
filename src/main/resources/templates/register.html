<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Register')}"></head>
  <body>
    <main class="auth-wrap">
      <div class="card auth-card">
        <a th:replace="~{fragments :: brand}"></a>
        <h1>Create an account</h1>
        <p class="subtitle">Start rating films in under a minute</p>

        <form th:object="${registerForm}" th:action="@{/register}" method="post" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" class="input" th:field="*{username}" th:errorclass="invalid" autocomplete="username" autofocus />
            <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" class="input" th:field="*{email}" th:errorclass="invalid" autocomplete="email" />
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
          </div>
          <div class="field">
            <label for="password">Password <span class="muted">min. 6 characters</span></label>
            <input type="password" id="password" class="input" th:field="*{password}" th:errorclass="invalid" autocomplete="new-password" />
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-footer">Already have an account? <a th:href="@{/login}">Sign in</a></p>
      </div>
    </main>
  </body>
</html>
