<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
  <head th:replace="~{fragments :: head('Movies')}"></head>
  <body>
    <nav th:replace="~{fragments :: navbar('movies')}"></nav>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Movies</h1>
          <p class="muted">
            <span th:text="${#lists.size(movies)}">0</span> films · click the stars to rate them
          </p>
        </div>
        <a th:href="@{/add}" class="btn btn-primary">+ Add movie</a>
      </div>

      <div class="toolbar" th:unless="${#lists.isEmpty(movies)}">
        <input id="search" type="search" class="input search" placeholder="Search by title, director or genre…" />
      </div>

      <div class="movie-grid" id="movie-grid">
        <article
          class="card movie"
          th:each="movie : ${movies}"
          th:attr="data-search=${#strings.toLowerCase(movie.title + ' ' + movie.director + ' ' + (movie.genre != null ? movie.genre.name : ''))}"
        >
          <div class="movie-top">
            <div>
              <h2 class="movie-title" th:text="${movie.title}">Title</h2>
              <p class="movie-meta">
                <span th:text="${movie.director}">Director</span> ·
                <span th:text="${movie.releaseYear}">2000</span>
              </p>
            </div>
            <span class="chip" th:if="${movie.genre != null}" th:text="${movie.genre.name}">Genre</span>
          </div>

          <div class="rating-block">
            <div>
              <div class="rating-label">Average</div>
              <div th:if="${movie.averageRating != null}">
                <div class="avg">
                  <span class="avg-number" th:text="${#numbers.formatDecimal(movie.averageRating, 1, 1)}">4.5</span>
                  <span class="avg-count" th:text="${movie.ratingCount == 1} ? '1 rating' : ${movie.ratingCount} + ' ratings'">2 ratings</span>
                </div>
                <span class="stars"
                  >★★★★★<span class="stars-fill" th:style="'width:' + ${movie.averageRating * 20} + '%'">★★★★★</span></span
                >
              </div>
              <div th:if="${movie.averageRating == null}" class="muted">No ratings yet</div>
            </div>

            <div>
              <div class="rating-label">Your rating</div>
              <form th:action="@{/rate/{id}(id=${movie.id})}" method="post" class="star-input">
                <button
                  type="submit"
                  name="score"
                  th:each="s : ${#numbers.sequence(5, 1, -1)}"
                  th:value="${s}"
                  th:title="'Rate ' + ${s} + ' / 5'"
                  th:classappend="${myRatings[movie.id] != null and s <= myRatings[movie.id]} ? 'on'"
                >
                  ★
                </button>
              </form>
            </div>
          </div>

          <div class="movie-actions">
            <a th:href="@{/edit/{id}(id=${movie.id})}" class="btn btn-ghost btn-sm">Edit</a>
            <a
              sec:authorize="hasAuthority('ADMIN')"
              th:href="@{/delete/{id}(id=${movie.id})}"
              class="btn btn-danger btn-sm"
              onclick="return confirm('Delete this movie and all its ratings?')"
              >Delete</a
            >
          </div>
        </article>
      </div>

      <div class="card empty" th:if="${#lists.isEmpty(movies)}">
        <p>No movies yet.</p>
        <a th:href="@{/add}" class="btn btn-primary">Add the first one</a>
      </div>
      <div class="card empty" id="no-results" hidden>No movies match your search.</div>
    </main>

    <script>
      // Simple client-side filter for the movie cards
      const search = document.getElementById("search");
      if (search) {
        const cards = document.querySelectorAll("#movie-grid .movie");
        const noResults = document.getElementById("no-results");
        search.addEventListener("input", () => {
          const q = search.value.trim().toLowerCase();
          let shown = 0;
          cards.forEach((card) => {
            const match = card.dataset.search.includes(q);
            card.hidden = !match;
            if (match) shown++;
          });
          noResults.hidden = shown > 0;
        });
      }
    </script>
  </body>
</html>
