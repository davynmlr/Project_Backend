<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Reset password</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <h1>Reset password</h1>

    <div th:if="${error}">
      <p th:text="${error}" style="color: red"></p>
      <p><a th:href="@{/forgot-password}">Request a new link</a></p>
    </div>

    <form th:if="${error == null}" th:object="${resetPasswordForm}" th:action="@{/reset-password}" method="post">
      <input type="hidden" th:field="*{token}" />
      <div>
        <label for="password">New password</label>
        <input type="password" id="password" th:field="*{password}" />
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red"></span>
      </div>
      <div>
        <label for="confirmPassword">Repeat password</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" />
        <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color: red"></span>
      </div>
      <div><input type="submit" value="Save password" /></div>
    </form>
  </body>
</html>
