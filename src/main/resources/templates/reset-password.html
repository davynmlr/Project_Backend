<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Reset password')}"></head>
  <body>
    <main class="auth-wrap">
      <div class="card auth-card">
        <a th:replace="~{fragments :: brand}"></a>
        <h1>Choose a new password</h1>
        <p class="subtitle">Pick something you haven't used before</p>

        <div th:if="${error}">
          <div class="alert alert-error" th:text="${error}"></div>
          <a th:href="@{/forgot-password}" class="btn btn-primary btn-block">Request a new link</a>
        </div>

        <form th:if="${error == null}" th:object="${resetPasswordForm}" th:action="@{/reset-password}" method="post" novalidate>
          <input type="hidden" th:field="*{token}" />
          <div class="field">
            <label for="password">New password <span class="muted">min. 6 characters</span></label>
            <input type="password" id="password" class="input" th:field="*{password}" th:errorclass="invalid" autocomplete="new-password" autofocus />
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
          </div>
          <div class="field">
            <label for="confirmPassword">Repeat password</label>
            <input type="password" id="confirmPassword" class="input" th:field="*{confirmPassword}" th:errorclass="invalid" autocomplete="new-password" />
            <span class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Save password</button>
        </form>

        <p class="auth-footer"><a th:href="@{/login}">← Back to sign in</a></p>
      </div>
    </main>
  </body>
</html>
