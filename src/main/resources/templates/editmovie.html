<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Edit movie')}"></head>
  <body>
    <nav th:replace="~{fragments :: navbar('')}"></nav>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Edit movie</h1>
          <p class="muted">Ratings are given from the movie list.</p>
        </div>
      </div>

      <form class="card form-card" th:object="${movie}" th:action="@{/save}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" class="input" th:field="*{title}" required />
        </div>
        <div class="field">
          <label for="director">Director</label>
          <input type="text" id="director" class="input" th:field="*{director}" required />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="releaseYear">Release year</label>
            <input type="number" id="releaseYear" class="input" min="1888" max="2100" th:field="*{releaseYear}" required />
          </div>
          <div class="field">
            <label for="genre">Genre</label>
            <select id="genre" class="input" th:field="*{genre}">
              <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}"></option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save changes</button>
          <a th:href="@{/movielist}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
