<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Forgot password')}"></head>
  <body>
    <main class="auth-wrap">
      <div class="card auth-card">
        <a th:replace="~{fragments :: brand}"></a>
        <h1>Forgot your password?</h1>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>

        <div class="alert alert-info" th:if="${message}" th:text="${message}"></div>

        <form th:action="@{/forgot-password}" method="post">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="input" autocomplete="email" required autofocus />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>

        <p class="auth-footer"><a th:href="@{/login}">← Back to sign in</a></p>
      </div>
    </main>
  </body>
</html>
