<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Add movie')}"></head>
  <body>
    <nav th:replace="~{fragments :: navbar('add')}"></nav>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Add movie</h1>
          <p class="muted">Add a film to the shared list. Everyone can rate it afterwards.</p>
        </div>
      </div>

      <form class="card form-card" th:object="${movie}" th:action="@{/save}" method="post">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" class="input" th:field="*{title}" required autofocus />
        </div>
        <div class="field">
          <label for="director">Director</label>
          <input type="text" id="director" class="input" th:field="*{director}" required />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="releaseYear">Release year</label>
            <input type="number" id="releaseYear" class="input" min="1888" max="2100" th:field="*{releaseYear}" required />
          </div>
          <div class="field">
            <label for="genre">Genre</label>
            <select id="genre" class="input" th:field="*{genre}">
              <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}"></option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="myRating">Your rating <span class="muted">optional</span></label>
          <select id="myRating" name="myRating" class="input">
            <option value="">Not rated</option>
            <option value="5">★★★★★ 5 – Masterpiece</option>
            <option value="4">★★★★ 4 – Great</option>
            <option value="3">★★★ 3 – Good</option>
            <option value="2">★★ 2 – Meh</option>
            <option value="1">★ 1 – Bad</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save movie</button>
          <a th:href="@{/movielist}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
