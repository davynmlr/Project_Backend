<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>FilmFavourites</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <h1>Add movie</h1>
    <div>
      <form th:object="${movie}" th:action="@{save}" action="#" method="post">
        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" />
        <label for="director">Director</label>
        <input type="text" id="director" th:field="*{director}" />
        <label for="releaseYear">Release Year</label>
        <input type="text" id="releaseYear" th:field="*{releaseYear}" />
        <label for="rating">Rating (1-5)</label>
        <input type="number" id="rating" min="1" max="5" th:field="*{rating}" />
        <label for="genre">Genre</label>
        <select id="genre" th:field="*{genre}">
          <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}"></option>
        </select>
        <input type="submit" value="Save" />
      </form>
    </div>
  </body>
</html>
