<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Login</title>
  </head>
  <body>
    <div th:if="${param.registered}">Registration successful. You can now sign in.</div>
    <div th:if="${param.reset}">Your password has been changed. You can now sign in.</div>
    <div th:if="${param.error}">Invalid username and password.</div>
    <form th:action="@{/login}" method="post">
      <div>
        <label>User Name: <input type="text" name="username" /></label>
      </div>
      <div>
        <label>Password: <input type="password" name="password" /></label>
      </div>
      <div><input type="submit" value="Sign In" /></div>
    </form>
    <p><a th:href="@{/forgot-password}">Forgot password?</a></p>
    <p>No account yet? <a th:href="@{/register}">Register</a></p>
  </body>
</html>
